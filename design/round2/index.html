<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ikigenba moods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Source+Serif+4:opsz,wght@8..60,200..900&amp;family=Plus+Jakarta+Sans:wght@200..800&amp;family=Inter:opsz,wght@14..32,100..900&amp;family=DM+Sans:opsz,wght@9..40,100..1000&amp;family=Archivo:wght@100..900&amp;family=Manrope:wght@200..800&amp;family=Bodoni+Moda:opsz,wght@6..96,400..900&amp;family=Work+Sans:wght@100..900&amp;family=Geist:wght@100..900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Sora:wght@100..800&amp;family=Fraunces:opsz,wght@9..144,100..900&amp;family=Figtree:wght@300..900&amp;display=swap">
<style>
  /* ---------- page chrome (not a mood) ---------- */
  :root { color-scheme: light dark; --pg-bg: #f2f2f2; --pg-fg: #111; --pg-muted: #666; }
  @media (prefers-color-scheme: dark) { :root { --pg-bg: #161616; --pg-fg: #eee; --pg-muted: #999; } }
  body { margin: 0; padding: 32px 16px 64px; background: var(--pg-bg); color: var(--pg-fg);
    font: 15px/1.5 system-ui, sans-serif; }
  .page { max-width: 1320px; margin: 0 auto; }
  .page > h1 { font-size: 20px; margin: 0 0 4px; }
  .page > p { color: var(--pg-muted); margin: 0 0 28px; max-width: 70ch; }
  .page > p a { color: inherit; }
  .grid { display: grid; gap: 36px 28px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }
  figure { margin: 0; display: grid; gap: 10px; align-content: start; }
  figcaption { font-size: 13px; color: var(--pg-muted); }
  figcaption i { display: block; font-style: normal; font-size: 12px; opacity: .8; }
  figcaption b { color: var(--pg-fg); font-size: 15px; margin-right: 6px; }

  /* ---------- font stacks (system only) ---------- */
  :root {
    --f-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --f-grotesk: Inter, "Helvetica Neue", "Arial Nova", "Nimbus Sans", Arial, sans-serif;
    --f-humanist: Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", sans-serif;
    --f-geometric: Avenir, "Avenir Next", Montserrat, Corbel, "URW Gothic", sans-serif;
    --f-rounded: ui-rounded, "SF Pro Rounded", Quicksand, Comfortaa, "Arial Rounded MT Bold", Manjari, sans-serif;
    --f-oldstyle: "Iowan Old Style", "Palatino Linotype", Palatino, "URW Palladio L", P052, serif;
    --f-transitional: Charter, "Bitstream Charter", "Sitka Text", Cambria, "C059", Georgia, serif;
    --f-didone: Didot, "Bodoni 72", "Bodoni MT", "Noto Serif Display", P052, serif;
    --f-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }

  /* ---------- shared tile skeleton, driven by per-mood variables ---------- */
  .mood {
    --radius: 0; --btn-radius: var(--radius); --surface: transparent; --line-soft: var(--line);
    --font-body: var(--f-sans); --font-head: var(--font-body); --head-weight: 700; --head-track: -0.01em;
    --h2-size: 26px; --bar-bg: transparent; --bar-fg: var(--fg); --bar-muted: var(--muted);
    --input-bg: var(--bg); --err-ring: transparent; --table-shadow: none; --ctl-shadow: none;
    background: var(--bg); color: var(--fg); font-family: var(--font-body); font-synthesis: none;
    border-radius: var(--frame-radius, 0); overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  }
  .mood .bar { display: flex; gap: 12px; align-items: baseline; padding: 13px 20px;
    background: var(--bar-bg); color: var(--bar-fg); border-bottom: 1px solid var(--bar-line, var(--line)); font-size: 13px; }
  .mood .mark { font-family: var(--font-head); font-weight: var(--mark-weight, 700); font-size: 15px; letter-spacing: var(--head-track); }
  .mood .svc { color: var(--bar-muted); }
  .mood .who { margin-left: auto; color: var(--bar-muted); }
  .mood .bar a { color: inherit; }
  .mood .body { padding: 24px 20px 26px; display: grid; gap: 20px; }
  .mood h2 { font-family: var(--font-head); font-weight: var(--head-weight); font-size: var(--h2-size);
    line-height: 1.12; letter-spacing: var(--head-track); margin: 0 0 8px; text-wrap: balance; }
  .mood .pitch p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .mood h3 { font-family: var(--font-head); font-size: 15px; font-weight: var(--h3-weight, 600); margin: 0 0 -10px; letter-spacing: var(--head-track); }
  .mood table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px;
    background: var(--surface); border: var(--table-border, 0); border-radius: var(--radius); overflow: hidden; box-shadow: var(--table-shadow); }
  .mood th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 9px 12px;
    border-bottom: 1px solid var(--line); background: var(--th-bg, transparent); }
  .mood td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
  .mood tr:last-child td { border-bottom: 0; }
  .mood .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mood .st { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
  .mood .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
  .mood .st.active { --dot: var(--ok); }
  .mood .st.paused { --dot: var(--warn); }
  .mood .st.retired { --dot: var(--muted); }
  .mood form { display: grid; gap: 6px; }
  .mood label { font-size: 13px; font-weight: 600; }
  .mood input { font: inherit; font-size: 14px; padding: 9px 11px; color: var(--fg); background: var(--input-bg);
    border: 1px solid var(--err); border-radius: var(--radius); box-shadow: 0 0 0 3px var(--err-ring), var(--ctl-shadow); outline: none; }
  .mood .err { color: var(--err); font-size: 13px; }
  .mood .err::before { content: "\26A0\FE0E  "; }
  .mood .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .mood button, .mood .btn2 { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; cursor: pointer;
    border-radius: var(--btn-radius); border: 1px solid transparent; text-decoration: none; box-shadow: var(--ctl-shadow); }
  .mood button { background: var(--accent); color: var(--accent-fg); }
  .mood .btn2 { background: transparent; color: var(--fg); border-color: var(--line); }

  /* ---------- 01 paper ---------- */
  .m-paper { --bg: #fbfaf7; --fg: #22211f; --muted: #6f6c66; --line: #e6e2da; --accent: #3d6650; --accent-fg: #fff;
    --ok: #3f7a57; --warn: #b07418; --err: #b3261e; --err-ring: #b3261e1a; --radius: 6px;
    --head-weight: 500; --h2-size: 30px; --head-track: -0.02em; --font-body: "Instrument Sans", var(--f-sans);
    }

  /* ---------- 02 editorial ---------- */
  .m-editorial { --bg: #f6f1e7; --fg: #1d1a16; --muted: #6b6257; --line: #d9ceb9; --line-soft: #e6dccb;
    --accent: #7a1f2b; --accent-fg: #fbf6ee; --ok: #3d6b3a; --warn: #a06d00; --err: #9b1c1c; --radius: 2px; --head-weight: 500; --h2-size: 34px; --head-track: -0.01em; --font-body: "Source Serif 4", var(--f-sans); --font-head: Newsreader, serif;
    }
  .m-editorial .mark { font-style: italic; font-weight: 500; font-size: 18px; }
  .m-editorial th { font-variant-caps: all-small-caps; letter-spacing: .06em; font-size: 13px; }
  .m-editorial h3 { font-style: italic; font-weight: 500; font-size: 18px; }

  /* ---------- 03 soft ---------- */
  .m-soft { --bg: #f4f3fb; --surface: #fff; --fg: #24223a; --muted: #6d6a86; --line: #e7e4f3; --accent: #5b4fe0; --accent-fg: #fff;
    --ok: #1f9d6a; --warn: #d18a12; --err: #d23f4f; --err-ring: #d23f4f22; --radius: 12px; --btn-radius: 999px; --frame-radius: 18px;
    --input-bg: #fff; --head-weight: 700;
    --table-shadow: 0 1px 2px rgba(60,50,140,.06), 0 6px 18px rgba(60,50,140,.07); --bar-line: transparent; --font-body: "Plus Jakarta Sans", var(--f-sans);
    }
  .m-soft table { border: 0; }
  .m-soft .st { padding: 3px 10px 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--dot) 13%, transparent); }

  /* ---------- 04 nordic ---------- */
  .m-nordic { --bg: #eef2f4; --surface: #fff; --fg: #17232b; --muted: #5b6b75; --line: #d5dde2; --line-soft: #e5ebee;
    --accent: #1f5f7a; --accent-fg: #fff; --ok: #2c7a5a; --warn: #a8741a; --err: #b8322a; --err-ring: #b8322a1f;
    --radius: 4px; --input-bg: #fff; --bar-bg: #17232b; --bar-fg: #eef2f4; --bar-muted: #9fb0ba; --bar-line: #17232b; --head-weight: 600; --table-border: 1px solid #d5dde2; --font-body: Inter, var(--f-sans);
    }

  /* ---------- 05 pastel ---------- */
  .m-pastel { --bg: #fdf1ea; --surface: #fff9f5; --fg: #3a2a2a; --muted: #7d6660; --line: #f0d6c8; --line-soft: #f5e3d9;
    --accent: #f08a6c; --accent-fg: #2a1512; --ok: #2f8f73; --warn: #c07c14; --err: #c43a3a; --err-ring: #c43a3a1c;
    --radius: 10px; --btn-radius: 10px; --frame-radius: 14px; --input-bg: #fff; --bar-bg: #cfe8df; --bar-line: #b9ddd0;
    --bar-muted: #4c6b61; --head-weight: 700; --table-border: 1px solid #f0d6c8; --font-body: "DM Sans", var(--f-sans);
    }
  .m-pastel .pitch { background: #e6e1f7; border-radius: 12px; padding: 18px; }
  .m-pastel .pitch p { color: #5a5070; }

  /* ---------- 06 blocks ---------- */
  .m-blocks { --bg: #fff; --fg: #111; --muted: #555; --line: #111; --line-soft: #ddd; --accent: #1b3fd1; --accent-fg: #fff;
    --ok: #0f8a4a; --warn: #c98a00; --err: #d1261b; --bar-bg: #1b3fd1; --bar-fg: #fff; --bar-muted: #c9d3ff; --bar-line: #1b3fd1; --head-weight: 800; --head-track: -0.03em; --h2-size: 30px; --th-bg: #111; --font-body: Archivo, var(--f-sans);
    }
  .m-blocks .pitch { background: #ffd23f; padding: 20px; margin: -24px -20px 0; }
  .m-blocks .pitch p { color: #3a3000; }
  .m-blocks th { color: #fff; border-bottom: 0; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
  .m-blocks input { border-width: 2px; }

  /* ---------- 07 one hue ---------- */
  .m-hue { --bg: #e4efec; --surface: #f2f8f6; --fg: #0d3b36; --muted: #3f6d67; --line: #b9d5cf; --line-soft: #cfe2de;
    --accent: #0d3b36; --accent-fg: #e4efec; --ok: #0f7a68; --warn: #8a6a10; --err: #a1301f; --err-ring: #a1301f1a;
    --radius: 3px; --input-bg: #f2f8f6; --bar-bg: #0d3b36; --bar-fg: #e4efec; --bar-muted: #8fbdb5; --bar-line: #0d3b36; --head-weight: 600; --h2-size: 28px; --font-body: Manrope, var(--f-sans);
    }

  /* ---------- 08 forest ---------- */
  .m-forest { --bg: #1e2a23; --surface: #25322b; --fg: #efe8d8; --muted: #a9b3a4; --line: #3a4a40; --line-soft: #2f3d35;
    --accent: #d9b25c; --accent-fg: #1e2a23; --ok: #8fcf9a; --warn: #e3b85a; --err: #f28c7c; --err-ring: #f28c7c22;
    --radius: 4px; --input-bg: #18221c;
    --head-weight: 400; --h2-size: 34px; --head-track: 0; --font-body: "Work Sans", var(--f-sans); --font-head: "Bodoni Moda", serif;
    }
  .m-forest .mark { font-size: 19px; font-weight: 400; }
  .m-forest h3 { font-weight: 400; font-size: 19px; }

  /* ---------- 09 minimal ---------- */
  .m-minimal { --bg: #fff; --surface: #fff; --fg: #0f1011; --muted: #6b6f76; --line: #ebebed; --accent: #0f1011; --accent-fg: #fff;
    --ok: #16a34a; --warn: #d97706; --err: #d0342c; --err-ring: #d0342c1f; --radius: 6px;
    --head-weight: 600; --h2-size: 22px; --head-track: -0.02em; --table-border: 1px solid #ebebed; --th-bg: #fafafa; --font-body: Geist, var(--f-sans);
    }
  .m-minimal { font-size: 13px; }
  .m-minimal .mark::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: currentColor; margin-right: 8px; }
  .m-minimal td, .m-minimal input, .m-minimal button, .m-minimal .btn2 { font-size: 13px; }
  .m-minimal button, .m-minimal .btn2 { padding: 7px 12px; }
  .m-minimal th { font-weight: 500; }

  /* ---------- 10 playful ---------- */
  .m-playful { --bg: #fff7d6; --surface: #fff; --fg: #111; --muted: #5a5245; --line: #111; --line-soft: #e8dfc0;
    --accent: #ff6b9a; --accent-fg: #111; --ok: #0a8a45; --warn: #e08a00; --err: #c8102e; --radius: 10px; --frame-radius: 16px;
    --input-bg: #fff; --head-weight: 800; --h2-size: 30px; --bar-bg: #8ed1fc; --bar-line: #111;
    --table-border: 2px solid #111; --table-shadow: 4px 4px 0 #111; --ctl-shadow: 3px 3px 0 #111; --font-body: "Bricolage Grotesque", var(--f-sans);
    }
  .m-playful input { border-width: 2px; }
  .m-playful button, .m-playful .btn2 { border: 2px solid #111; }
  .m-playful .btn2 { background: #fff; }
  .m-playful th { color: #111; border-bottom-width: 2px; border-bottom-color: #111; }

  /* ---------- 11 midnight ---------- */
  .m-midnight { --bg: #0b1020; --surface: rgba(255,255,255,.035); --fg: #e6e9f2; --muted: #8f97ad; --line: rgba(255,255,255,.09);
    --line-soft: rgba(255,255,255,.06); --accent: #8aa6ff; --accent-fg: #0b1020; --ok: #4ade80; --warn: #fbbf24; --err: #ff7b86;
    --err-ring: #ff7b8622; --radius: 8px; --input-bg: rgba(255,255,255,.04); --head-weight: 600;
    --head-track: -0.02em; --table-border: 1px solid rgba(255,255,255,.08);
    background: radial-gradient(120% 80% at 100% 0%, #1d2a5a 0%, transparent 60%), radial-gradient(80% 60% at 0% 100%, #2a1a4a 0%, transparent 60%), #0b1020; --font-body: Sora, var(--f-sans);
    }
  .m-midnight button { box-shadow: 0 0 0 1px #8aa6ff, 0 6px 24px -6px #8aa6ffaa; }
  .m-midnight h2 { background: linear-gradient(90deg, #fff, #aab8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- 12 espresso ---------- */
  .m-espresso { --bg: #1c1512; --surface: #241b17; --fg: #f1e6dc; --muted: #b3a092; --line: #3a2d26; --line-soft: #2e231e;
    --accent: #d9774b; --accent-fg: #1c1512; --ok: #9cc58a; --warn: #e6b35a; --err: #ff907c; --err-ring: #ff907c22;
    --radius: 5px; --input-bg: #16100d;
    --head-weight: 600; --h2-size: 30px; --table-border: 1px solid #3a2d26; --font-body: Figtree, var(--f-sans); --font-head: Fraunces, serif;
    }
</style>
</head>
<body>
<div class="page">
<h1>Round two: moods (archived)</h1>
<p>Twelve directions, same slice of content, each set in the Google Font it would actually ship with (named in italics). Reply with the numbers you like, the ones you hate, and anything about a tile that caught your eye. <a href="../index.html">← Current work</a> · <a href="../round3/index.html">round three</a> · <a href="../round1/index.html">round one</a></p>

<div class="grid">
<!-- Every tile uses identical markup; only the class on .mood changes. -->
<template id="tile">
  <header class="bar"><span class="mark">ikigenba</span><span class="svc">dummy</span><span class="who">ada@acme.dev</span><a href="#">Sign out</a></header>
  <div class="body">
    <div class="pitch">
      <h2>Run the systems you build.</h2>
      <p>Every service in your space, one sign-in, one place to watch it all.</p>
    </div>
    <h3>Widgets</h3>
    <table>
      <thead><tr><th>Name</th><th class="num">Count</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>alpha</td><td class="num">3</td><td><span class="st active">active</span></td></tr>
        <tr><td>beta</td><td class="num">0</td><td><span class="st paused">paused</span></td></tr>
        <tr><td>gamma</td><td class="num">12</td><td><span class="st retired">retired</span></td></tr>
      </tbody>
    </table>
    <form onsubmit="return false">
      <label>Name</label>
      <input type="text" value="alpha" aria-invalid="true">
      <span class="err">that name is already taken</span>
      <div class="actions"><button type="submit">Add widget</button><a class="btn2" href="#">Cancel</a></div>
    </form>
  </div>
</template>

<figure><figcaption><b>01 paper</b>Light and airy. Warm white, charcoal, sage; light-weight headings. <i>Instrument Sans</i></figcaption><section class="mood m-paper"></section></figure>
<figure><figcaption><b>02 editorial</b>Serif, cream, oxblood. Reads like a well-set journal. <i>Newsreader / Source Serif 4</i></figcaption><section class="mood m-editorial"></section></figure>
<figure><figcaption><b>03 soft</b>Rounded, gentle shadows, violet accent, pill statuses. <i>Plus Jakarta Sans</i></figcaption><section class="mood m-soft"></section></figure>
<figure><figcaption><b>04 nordic</b>Cool grey-blue, dark top bar, crisp grotesk, restrained. <i>Inter</i></figcaption><section class="mood m-nordic"></section></figure>
<figure><figcaption><b>05 pastel</b>Peach, mint, lilac; coral action. Friendly without being childish. <i>DM Sans</i></figcaption><section class="mood m-pastel"></section></figure>
<figure><figcaption><b>06 blocks</b>Saturated color fields: cobalt, yellow, black. Loud, poster-like. <i>Archivo</i></figcaption><section class="mood m-blocks"></section></figure>
<figure><figcaption><b>07 one hue</b>Everything is a shade of one deep teal. Calm, coherent, ownable. <i>Manrope</i></figcaption><section class="mood m-hue"></section></figure>
<figure><figcaption><b>08 forest</b>Deep green ground, cream text, gold; a high-contrast display serif. <i>Bodoni Moda / Work Sans</i></figcaption><section class="mood m-forest"></section></figure>
<figure><figcaption><b>09 minimal</b>High-craft minimal. Small type, near-invisible lines, black as the accent. <i>Geist</i></figcaption><section class="mood m-minimal"></section></figure>
<figure><figcaption><b>10 playful</b>Chunky outlines, hard offset shadows, bright pink and sky. <i>Bricolage Grotesque</i></figcaption><section class="mood m-playful"></section></figure>
<figure><figcaption><b>11 midnight</b>Deep navy with color glows, periwinkle accent, gradient headline. <i>Sora</i></figcaption><section class="mood m-midnight"></section></figure>
<figure><figcaption><b>12 espresso</b>Warm dark brown, terracotta, serif headings over a humanist body. <i>Fraunces / Figtree</i></figcaption><section class="mood m-espresso"></section></figure>
</div>
</div>
<script>
  const tpl = document.getElementById("tile");
  document.querySelectorAll(".mood").forEach((m) => m.appendChild(tpl.content.cloneNode(true)));
</script>
</body>
</html>
