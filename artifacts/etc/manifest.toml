app = "artifacts"
description = "Binary files agents and services share"
default = false
mcp = true
guests = false
secrets = []

[env]
ARTIFACT_MAX_BYTES = "1073741824"
IMPORT_SECONDS = "600"

[database]
engine = "sqlite"
path = "state/artifacts.db"

[resources]
memory_max = "128M"

[home]
group = "core"
