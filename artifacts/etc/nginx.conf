location = /srv/artifacts/.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:3009/.well-known/oauth-protected-resource;
}

location = /srv/artifacts/mcp {
    auth_request /_authn;
    error_page 500 = @artifacts_authn_500;

    auth_request_set $af_owner_id $upstream_http_x_owner_id;
    auth_request_set $af_owner_email $upstream_http_x_owner_email;
    auth_request_set $af_owner_name $upstream_http_x_owner_name;
    auth_request_set $af_owner_picture $upstream_http_x_owner_picture;
    auth_request_set $af_client_id $upstream_http_x_client_id;
    auth_request_set $af_correlation_id $upstream_http_x_correlation_id;
    auth_request_set $af_retry_after $upstream_http_retry_after;

    proxy_set_header X-Owner-Id $af_owner_id;
    proxy_set_header X-Owner-Email $af_owner_email;
    proxy_set_header X-Owner-Name $af_owner_name;
    proxy_set_header X-Owner-Picture $af_owner_picture;
    proxy_set_header X-Client-Id $af_client_id;
    proxy_set_header X-Correlation-Id $af_correlation_id;
    proxy_pass http://127.0.0.1:3009/mcp;
}

location = /srv/artifacts/feed {
    return 404;
}

location = /srv/artifacts/ {
    auth_request /_session-authn;
    error_page 401 = @login_bounce;
    error_page 500 = @artifacts_authn_500;

    auth_request_set $af_session_owner_id $upstream_http_x_owner_id;
    auth_request_set $af_session_owner_email $upstream_http_x_owner_email;
    auth_request_set $af_session_owner_name $upstream_http_x_owner_name;
    auth_request_set $af_session_owner_picture $upstream_http_x_owner_picture;
    auth_request_set $af_session_correlation_id $upstream_http_x_correlation_id;
    auth_request_set $af_retry_after $upstream_http_retry_after;

    proxy_set_header X-Owner-Id $af_session_owner_id;
    proxy_set_header X-Owner-Email $af_session_owner_email;
    proxy_set_header X-Owner-Name $af_session_owner_name;
    proxy_set_header X-Owner-Picture $af_session_owner_picture;
    proxy_set_header X-Correlation-Id $af_session_correlation_id;
    proxy_pass http://127.0.0.1:3009/;
}

location /srv/artifacts/static/ {
    auth_request /_session-authn;
    error_page 401 = @login_bounce;
    proxy_pass http://127.0.0.1:3009/static/;
}

location /srv/artifacts/f/ {
    proxy_set_header X-Correlation-Id "";
    proxy_pass http://127.0.0.1:3009/f/;
}

location /srv/artifacts/p/ {
    auth_request /_session-authn;
    error_page 401 = @login_bounce;
    error_page 500 = @artifacts_authn_500;

    auth_request_set $af_session_owner_id $upstream_http_x_owner_id;
    auth_request_set $af_session_owner_email $upstream_http_x_owner_email;
    auth_request_set $af_session_owner_name $upstream_http_x_owner_name;
    auth_request_set $af_session_owner_picture $upstream_http_x_owner_picture;
    auth_request_set $af_session_correlation_id $upstream_http_x_correlation_id;
    auth_request_set $af_retry_after $upstream_http_retry_after;

    proxy_set_header X-Owner-Id $af_session_owner_id;
    proxy_set_header X-Owner-Email $af_session_owner_email;
    proxy_set_header X-Owner-Name $af_session_owner_name;
    proxy_set_header X-Owner-Picture $af_session_owner_picture;
    proxy_set_header X-Correlation-Id $af_session_correlation_id;
    proxy_pass http://127.0.0.1:3009/p/;
}

location /srv/artifacts/u/ {
    client_max_body_size 1g;
    proxy_set_header X-Correlation-Id "";
    proxy_pass http://127.0.0.1:3009/u/;
}

location /srv/artifacts/ {
    return 404;
}

location @artifacts_authn_500 {
    add_header Retry-After $af_retry_after always;
    return 429;
}
