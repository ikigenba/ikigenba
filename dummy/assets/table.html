{{define "table"}}<table id="widgets-table">
<thead><tr><th>Name</th><th class="num">Count</th><th>Status</th></tr></thead>
<tbody>{{range .}}
<tr><td>{{.Name}}</td><td class="num">{{.Count}}</td><td><span class="status" data-status="{{.Status}}">{{.Status}}</span></td></tr>{{end}}
</tbody>
</table>{{end}}
