version: "2"

linters:
  # The v2 standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # plus a curated strict layer.
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Human-approved exception for R-5LFH-HU7S: callers select the
      # executables prescribed by the design; Exec passes arguments directly.
      # Keep G204 active for every other subprocess call.
      - path: ^internal/host/host\.go$
        linters:
          - gosec
        text: '^G204:'
        source: 'cmd := exec\.CommandContext\(ctx, command\.Name, command\.Args\.\.\.\)'

formatters:
  enable:
    - gofmt
    - goimports
