name: Release opsctl

# Monorepo release: tag opsctl/vX.Y.Z. GoReleaser OSS wants a plain semver tag,
# so we lay a local vX.Y.Z tag on the commit, build/checksum with publishing
# skipped, and publish the GitHub release ourselves on the real monorepo tag.
#
# opsctl is an installation boundary, not a downloadable dev tool: the release
# ships a single static linux/amd64 binary named opsctl-<version>-linux-amd64,
# checksums.txt, and install.sh, which hosts fetch and run. GoReleaser's binary
# archive carries that asset name but keeps the file under dist/<target>/opsctl,
# so we place it at the asset name before publishing and add install.sh.

on:
  push:
    tags: ["opsctl/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#opsctl/}" >> "$GITHUB_OUTPUT"

      - name: Lay a local semver tag for GoReleaser
        run: git tag -f "${{ steps.v.outputs.version }}"

      - name: Build and checksum with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          workdir: opsctl
          args: release --clean --skip=publish,announce,validate
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.v.outputs.version }}

      - name: Assemble and publish the release on the monorepo tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${{ steps.v.outputs.version }}
          asset="opsctl-${version}-linux-amd64"
          binary=$(find opsctl/dist -type f -name opsctl -path '*linux_amd64*' | head -n1)
          # The binary must report the tag's version, learned by running it, not
          # by reading source; a mismatch means the release was built wrong.
          reported=$("$binary" version)
          if [[ $reported != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME names $version but the binary reports $reported" >&2
            exit 1
          fi
          install -m 0755 "$binary" "opsctl/dist/$asset"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "opsctl/dist/$asset" \
            opsctl/dist/checksums.txt \
            opsctl/install.sh
