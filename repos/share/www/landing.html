<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Service}} · repos</title>
  <link rel="stylesheet" href="static/tokens.css">
  <link rel="icon" sizes="any" href="static/favicon.ico">
  <link rel="icon" type="image/png" href="static/favicon-32.png">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
  <script src="static/landing.js" defer></script>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="static/fonts/space-grotesk.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="static/fonts/ibm-plex-sans.woff2">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--color-text);
      background: var(--color-bg);
      font-family: var(--font-body);
      font-size: var(--text-body-size);
      line-height: var(--text-body-lh);
    }
    main {
      position: relative;
      width: min(100% - 32px, 960px);
      min-height: 100vh;
      margin: 0 auto;
      padding: var(--space-16) 0;
      display: grid;
      align-content: center;
      gap: var(--space-12);
    }
    .eyebrow, .version {
      font-family: var(--font-mono);
      font-size: var(--text-label-size);
      line-height: var(--text-label-lh);
      font-weight: var(--text-label-weight);
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .home {
      position: absolute;
      top: var(--space-8);
      left: 0;
      font-family: var(--font-mono);
      font-size: var(--text-label-size);
      line-height: var(--text-label-lh);
      font-weight: var(--text-label-weight);
      text-transform: uppercase;
      color: var(--color-text-muted);
      text-decoration: none;
    }
    .home:hover, .home:focus-visible { color: var(--color-text); }
    h1 {
      margin: var(--space-3) 0 0;
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1.15;
      font-weight: var(--text-display-weight);
      letter-spacing: 0;
    }
    .version { margin-left: var(--space-3); }
    p {
      max-width: 680px;
      margin: var(--space-6) 0 0;
      color: var(--color-text-muted);
      font-size: var(--text-body-lg-size);
      line-height: var(--text-body-lg-lh);
    }
    [hidden] { display: none !important; }
    .no-js .js-only { display: none; }
    .js .js-only { visibility: visible; }
    .repositories { display: grid; gap: var(--space-4); }
    .controls, .pager { display: flex; gap: var(--space-3); align-items: center; }
    .input {
      flex: 1;
      min-width: 0;
      height: var(--control-h-md);
      padding: 0 var(--space-3);
      font: inherit;
      color: var(--color-text);
      background: var(--color-bg);
      border: var(--border-width) solid var(--color-border-strong);
      border-radius: var(--radius);
    }
    .input::placeholder { color: var(--color-text-subtle); }
    .input:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-weak); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      height: var(--control-h-md);
      padding: 0 var(--space-4);
      font-family: var(--font-body);
      font-size: var(--text-body-size);
      font-weight: 600;
      border: var(--border-width) solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--color-accent-weak); }
    .btn-secondary { color: var(--color-text); background: var(--color-surface); border-color: var(--color-border-strong); }
    .btn-secondary:hover { background: var(--color-surface-2); }
    .btn-ghost { color: var(--color-text-muted); background: transparent; }
    .btn-ghost:hover { color: var(--color-text); background: var(--color-surface-2); }
    .repo-table { width: 100%; border-collapse: collapse; border-top: var(--border-width) solid var(--color-border); border-bottom: var(--border-width) solid var(--color-border); }
    .repo-table th, .repo-table td { padding: var(--space-4); border-top: var(--border-width) solid var(--color-border); text-align: left; vertical-align: top; }
    .repo-table thead th { border-top: 0; font-family: var(--font-mono); font-size: var(--text-label-size); line-height: var(--text-label-lh); font-weight: var(--text-label-weight); text-transform: uppercase; color: var(--color-text-muted); }
    .repo-table th[data-sort-key] { cursor: pointer; }
    .repo-table th[data-sort-key]:hover { color: var(--color-text); }
    .repo-table th[aria-sort="ascending"]::after { content: " ▲"; }
    .repo-table th[aria-sort="descending"]::after { content: " ▼"; }
    .repo-table td { overflow-wrap: anywhere; }
    .sha { font-family: var(--font-mono); }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      height: var(--control-h-sm);
      padding: 0 var(--space-3);
      color: var(--color-text-muted);
      background: transparent;
      border: var(--border-width) solid var(--color-border-strong);
      border-radius: var(--radius);
      cursor: pointer;
    }
    .copy-btn:hover, .copy-btn:focus-visible { color: var(--color-text); background: var(--color-surface-2); }
    .copy-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--color-accent-weak); }
    .copy-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
    .copy-label { min-width: var(--space-12); font-family: var(--font-mono); font-size: var(--text-label-size); line-height: var(--text-label-lh); font-weight: var(--text-label-weight); text-align: right; text-transform: uppercase; }
    .repo-table td[data-label="Copy"] { text-align: right; }
    .copy-btn.is-copied { color: var(--color-accent); border-color: var(--color-accent); }
    .no-match { max-width: none; margin: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 720px) {
      main { padding: var(--space-12) 0; }
      .repo-table, .repo-table thead, .repo-table tbody, .repo-table tr, .repo-table th, .repo-table td { display: block; }
      .repo-table thead { display: none; }
      .repo-table tr { border-top: var(--border-width) solid var(--color-border); }
      .repo-table tr:first-child { border-top: 0; }
      .repo-table td { border-top: 0; padding: var(--space-3) 0; }
      .repo-table td::before { content: attr(data-label); display: block; margin-bottom: var(--space-1); font-family: var(--font-mono); font-size: var(--text-label-size); text-transform: uppercase; color: var(--color-text-muted); }
    }
  </style>
</head>
<body>
  <main>
    <a class="home" href="/">Home</a>
    <section aria-labelledby="page-title">
      <div class="eyebrow">Git custodian</div>
      <h1 id="page-title">{{.Service}} <span class="version">{{.Version}}</span></h1>
      <p>Holds one git repository per versioned artifact and answers ordinary git clients through the suite gateway.</p>
    </section>
    <div class="controls js-only" hidden>
      <input type="search" class="input js-only" id="repo-search" aria-label="Search repositories" placeholder="Search repositories" hidden>
      <button type="button" class="btn btn-ghost js-only" id="repo-clear" hidden>Clear</button>
    </div>
    <section class="repositories">
      <script type="application/json" id="repos-data">{{.ReposData}}</script>
      <table class="repo-table">
        <thead><tr><th scope="col" data-sort-key="key">Name</th><th scope="col">Sha</th><th scope="col"><span class="sr-only">Copy</span></th></tr></thead>
        <tbody>
          {{range .Repos}}
          <tr>
            <td data-label="Name">{{.Key}}</td>
            <td data-label="Sha" class="sha">{{if .Sha}}{{.Sha}}{{else}}—{{end}}</td>
            <td data-label="Copy"><button type="button" class="copy-btn js-only" data-clone-path="{{.ClonePath}}" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1"></rect><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"></path></svg><span class="copy-label">Copy</span></button></td>
          </tr>
          {{end}}
        </tbody>
      </table>
      <p class="no-match js-only" hidden>No repositories match.</p>
      <div class="pager js-only" hidden>
        <button type="button" class="btn btn-secondary" id="pager-prev">Prev</button>
        <span id="pager-label">Page 1 of 1</span>
        <button type="button" class="btn btn-secondary" id="pager-next">Next</button>
      </div>
    </section>
  </main>
</body>
</html>
