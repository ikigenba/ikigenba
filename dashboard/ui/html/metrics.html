<!DOCTYPE html>
<html lang="en">
<head>
  {{template "shell_head" .}}
  <title>Metrics · ikigenba dashboard</title>
</head>
<body>
  {{template "shell_header" .}}

  <main class="page">
    <section class="section metrics" aria-label="Metrics">
      <div class="section-head">
        <h1>Metrics</h1>
        <span class="rule"></span>
      </div>
      <div id="metrics-block" data-fragment="/metrics/fragment">
        {{template "metrics_charts" .Charts}}
      </div>
    </section>
  </main>
  {{template "shell_footer" .}}
</body>
</html>
