<!DOCTYPE html>
<html lang="en">
<head>
  {{template "shell_head" .}}
  <title>Choose a sign-in provider — ikigenba</title>
</head>
<body>
  {{template "shell_header" .}}
  <main class="page signin-wall">
    <h2 class="signin-title">Choose how to sign in</h2>
    <p class="signin-lede">Select the identity provider for this connection.</p>
    <hr class="signin-rule">
    <a href="{{.GoogleURL}}" class="btn btn-primary btn-lg btn-accent-link">Continue with Google</a>
    <a href="{{.GitHubURL}}" class="btn btn-primary btn-lg btn-accent-link">Continue with GitHub</a>
  </main>
  {{template "shell_footer" .}}
</body>
</html>
