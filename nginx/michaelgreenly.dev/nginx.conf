server {
    listen 80;
    listen [::]:80;
    server_name michaelgreenly.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name michaelgreenly.dev;

    ssl_certificate     /etc/letsencrypt/live/michaelgreenly.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/michaelgreenly.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3004/public/michaelgreenly-dev/;
        proxy_set_header X-Correlation-Id "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
