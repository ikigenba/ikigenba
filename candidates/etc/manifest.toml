app = "candidates"
description = "Candidate businesses resolved from the records scrapes collects, judged and read through the owner's cohorts"
default = false
mcp = true
guests = false
secrets = []

[env]
CANDIDATES_KEEP_PASSES = "20"

[database]
engine = "sqlite"
path = "state/candidates.db"

[resources]
memory_max = "256M"

[home]
group = "application"
