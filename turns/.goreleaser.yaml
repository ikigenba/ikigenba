version: 2

project_name: turns

builds:
  - id: turns
    main: ./cmd/turns
    binary: turns
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: turns
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# The workflow publishes the release itself (gh release create --generate-notes)
# on the real monorepo tag; goreleaser only builds and archives.
changelog:
  disable: true
