location = /srv/telemetry/.well-known/oauth-protected-resource {
    proxy_set_header X-Correlation-Id "";
    proxy_pass http://127.0.0.1:3008/.well-known/oauth-protected-resource;
}

location = /srv/telemetry/mcp {
    auth_request /_authn;
    auth_request_set $tm_owner_id $upstream_http_x_owner_id;
    auth_request_set $tm_owner_email $upstream_http_x_owner_email;
    auth_request_set $tm_owner_name $upstream_http_x_owner_name;
    auth_request_set $tm_owner_picture $upstream_http_x_owner_picture;
    auth_request_set $tm_client_id $upstream_http_x_client_id;
    auth_request_set $tm_corr $upstream_http_x_correlation_id;
    auth_request_set $tm_authn_status $upstream_status;
    auth_request_set $tm_retry_after $upstream_http_retry_after;

    proxy_set_header X-Owner-Id $tm_owner_id;
    proxy_set_header X-Owner-Email $tm_owner_email;
    proxy_set_header X-Owner-Name $tm_owner_name;
    proxy_set_header X-Owner-Picture $tm_owner_picture;
    proxy_set_header X-Client-Id $tm_client_id;
    proxy_set_header X-Correlation-Id $tm_corr;

    error_page 500 = @telemetry_authn_500;
    proxy_pass http://127.0.0.1:3008/mcp;
}

location @telemetry_authn_500 {
    if ($tm_authn_status = 429) {
        add_header Retry-After $tm_retry_after always;
        return 429;
    }
    return 500;
}

location = /srv/telemetry/ {
    auth_request /_session-authn;
    error_page 401 = @login_bounce;
    auth_request_set $telemetry_session_owner $upstream_http_x_owner_email;
    auth_request_set $telemetry_session_owner_id $upstream_http_x_owner_id;
    auth_request_set $telemetry_session_owner_name $upstream_http_x_owner_name;
    auth_request_set $telemetry_session_owner_picture $upstream_http_x_owner_picture;
    auth_request_set $telemetry_session_corr $upstream_http_x_correlation_id;

    proxy_set_header X-Owner-Email $telemetry_session_owner;
    proxy_set_header X-Owner-Id $telemetry_session_owner_id;
    proxy_set_header X-Owner-Name $telemetry_session_owner_name;
    proxy_set_header X-Owner-Picture $telemetry_session_owner_picture;
    proxy_set_header X-Correlation-Id $telemetry_session_corr;

    proxy_pass http://127.0.0.1:3008/;
}

location /srv/telemetry/static/ {
    auth_request /_session-authn;
    error_page 401 = @login_bounce;
    auth_request_set $telemetry_static_corr $upstream_http_x_correlation_id;
    proxy_set_header X-Correlation-Id $telemetry_static_corr;
    proxy_pass http://127.0.0.1:3008/static/;
}

location /srv/telemetry/ {
    return 404;
}
