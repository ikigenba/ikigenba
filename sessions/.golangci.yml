version: "2"

linters:
  # The v2 standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # plus a curated strict layer.
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam

  exclusions:
    rules:
      # A requirement id (R-XXXX-XXXX) is an opaque token, not prose: the
      # spellchecker never judges a line that carries one.
      - linters:
          - misspell
        source: 'R-[A-Z0-9]{4}-[A-Z0-9]{4}'

formatters:
  enable:
    - gofmt
    - goimports
