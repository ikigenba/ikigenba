version: "2"

linters:
  # The v2 standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # plus a curated strict layer.
  default: standard
  enable:
    - depguard
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    depguard:
      # Nothing below main reaches the real process (D01); only proc reads
      # device and inode numbers through syscall.
      rules:
        below-main:
          files: ["!**/cmd/**", "!**/*_test.go"]
          deny:
            - pkg: os
              desc: only main touches the process
            - pkg: net
              desc: only main touches the process
            - pkg: path/filepath
              desc: paths are fs.FS names
        no-syscall:
          files: ["!**/internal/proc/**", "!**/cmd/**", "!**/*_test.go"]
          deny:
            - pkg: syscall
              desc: only proc reads Stat_t
    forbidigo:
      # Output goes through the io.Writer the run seam is given, never the
      # builtins, which write to the process's standard error.
      forbid:
        - pattern: ^(print|println)$

formatters:
  enable:
    - gofmt
    - goimports
