version: "2"

linters:
  # The v2 standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # plus a curated strict layer.
  default: standard
  enable:
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    forbidigo:
      # Output goes through the io.Writer the run seam is given, never the
      # builtins, which write to the process's standard error.
      forbid:
        - pattern: ^(print|println)$

formatters:
  enable:
    - gofmt
    - goimports
